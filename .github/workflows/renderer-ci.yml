name: Renderer CI

on:
  pull_request:
    paths:
      - "packages/renderer/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/renderer-ci.yml"
      - ".github/workflows/publish-renderer.yml"
  push:
    branches: [main]
    paths:
      - "packages/renderer/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/workflows/renderer-ci.yml"
      - ".github/workflows/publish-renderer.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.0 && test "$(npm --version)" = "11.19.0"
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm pack --workspace packages/renderer --dry-run
