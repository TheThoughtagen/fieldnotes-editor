name: Publish Renderer

on:
  push:
    tags:
      - "renderer-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.19.0 && test "$(npm --version)" = "11.19.0"
      - name: Validate release tag
        run: >-
          node -e 'const tag = process.env.GITHUB_REF_NAME;
          const version = require("./packages/renderer/package.json").version;
          if (!/^renderer-v\d+\.\d+\.\d+$/.test(tag) || tag !== `renderer-v${version}`) {
          console.error(`Tag ${tag} must exactly match renderer-v${version}`); process.exit(1); }'
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --workspace packages/renderer --dry-run
      - run: npm publish --workspace packages/renderer --access public --provenance
