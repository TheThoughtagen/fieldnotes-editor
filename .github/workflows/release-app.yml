name: Release App
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/app-ci.yml
  release:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all release credentials and valid tag
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          for key in DEVELOPER_ID APPLE_TEAM_ID SIGNING_CERTIFICATE SIGNING_PASSWORD NOTARY_PRIVATE_KEY NOTARY_KEY_ID; do
            test -n "${!key}" || { echo "Required release secret missing: $key" >&2; exit 1; }
          done
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.0 && npm ci
      - run: scripts/bundle-app.sh release
      - name: Import temporary signing credentials
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/fieldnotes.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$NOTARY_PRIVATE_KEY" > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$SIGNING_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - run: scripts/sign-and-package.sh
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
      - name: Verify mounted distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/dmg"
          hdiutil attach "build/FIELDNOTES-$APP_VERSION.dmg" -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/dmg"' EXIT
          test "$(readlink "$RUNNER_TEMP/dmg/Applications")" = /Applications
          xcrun stapler validate "$RUNNER_TEMP/dmg/FIELDNOTES.app"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/dmg/FIELDNOTES.app"
          spctl --assess --type execute -v "$RUNNER_TEMP/dmg/FIELDNOTES.app"
          "$RUNNER_TEMP/dmg/FIELDNOTES.app/Contents/Resources/bin/fieldnotes" --help
      - name: Publish immutable release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "build/FIELDNOTES-$APP_VERSION.dmg" "build/FIELDNOTES-$APP_VERSION.sha256" --verify-tag --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .immutable)" = true || { echo "Published release is not immutable; repository policy changed or was not enabled" >&2; exit 1; }
      - name: Remove credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/fieldnotes.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"
      - name: Preserve notarization reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: notary-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/notary-reports/
          if-no-files-found: ignore
          retention-days: 14
  homebrew:
    needs: release
    if: vars.ENABLE_HOMEBREW == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update tap after release exists
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAP_TOKEN" || { echo "ENABLE_HOMEBREW requires TAP_TOKEN" >&2; exit 1; }
          APP_VERSION=${GITHUB_REF_NAME#v}
          mkdir -p build
          gh release download "$GITHUB_REF_NAME" --pattern "FIELDNOTES-$APP_VERSION.sha256" --dir build
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .immutable)" = true || { echo "Release is not immutable; enable repository immutable releases before tagging" >&2; exit 1; }
          checksum=$(awk '{print $1}' "build/FIELDNOTES-$APP_VERSION.sha256")
          sed -e "s/@VERSION@/$APP_VERSION/g" -e "s/@SHA256@/$checksum/g" packaging/Casks/fieldnotes.rb.template > "$RUNNER_TEMP/fieldnotes.rb"
          GH_TOKEN="$TAP_TOKEN" gh auth setup-git
          GH_TOKEN="$TAP_TOKEN" git clone https://github.com/TheThoughtagen/homebrew-tap.git "$RUNNER_TEMP/tap"
          git -C "$RUNNER_TEMP/tap" show-ref --verify refs/heads/main || { echo "Tap needs a reviewed initial main branch" >&2; exit 1; }
          git -C "$RUNNER_TEMP/tap" checkout -b "fieldnotes-$APP_VERSION"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cp "$RUNNER_TEMP/fieldnotes.rb" "$RUNNER_TEMP/tap/Casks/fieldnotes.rb"
          git -C "$RUNNER_TEMP/tap" config user.name github-actions[bot]
          git -C "$RUNNER_TEMP/tap" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$RUNNER_TEMP/tap" add Casks/fieldnotes.rb
          git -C "$RUNNER_TEMP/tap" commit -m "fieldnotes $APP_VERSION"
          brew tap TheThoughtagen/tap "$RUNNER_TEMP/tap"
          brew audit --cask --new TheThoughtagen/tap/fieldnotes
          brew install --cask TheThoughtagen/tap/fieldnotes
          command -v fieldnotes
          fieldnotes --help
          printf '# Release smoke\n' > "$RUNNER_TEMP/release-smoke.md"
          fieldnotes "$RUNNER_TEMP/release-smoke.md" --mode source
          brew uninstall --cask fieldnotes
          GH_TOKEN="$TAP_TOKEN" git -C "$RUNNER_TEMP/tap" push origin "HEAD:refs/heads/fieldnotes-$APP_VERSION"
          tap_sha=$(git -C "$RUNNER_TEMP/tap" rev-parse HEAD)
          GH_TOKEN="$TAP_TOKEN" gh api --method POST "repos/TheThoughtagen/homebrew-tap/statuses/$tap_sha" -f state=success -f context=fieldnotes/distribution -f description="Cask audit, install, CLI smoke, uninstall passed" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf 'Update FIELDNOTES to %s.\n\nValidated: immutable release, stapled DMG checksum, cask audit, install, CLI help/open, uninstall. Independent review is required before merge.\n' "$APP_VERSION" > "$RUNNER_TEMP/tap-pr.md"
          GH_TOKEN="$TAP_TOKEN" gh pr create --repo TheThoughtagen/homebrew-tap --base main --head "fieldnotes-$APP_VERSION" --title "fieldnotes $APP_VERSION" --body-file "$RUNNER_TEMP/tap-pr.md"
